<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image Mask Tool - Game Tailors</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/hugeicons@1.0.0/css/hugeicons.css" />
  </head>
  <body>
    <nav class="sidebar">
      <div class="company-name">Game Tailors</div>
      
      <div class="sidebar-section">
        <div class="section-title">Tools</div>
        <ul class="sidebar-links">
          <li class="active"><a href="image-mask.html">Image Mask</a></li>
          <li><a href="quotes.html">Quotes</a></li>
        </ul>
      </div>

      <div class="sidebar-section">
        <div class="section-title">Brand Book</div>
        <ul class="sidebar-links">
          <li><a href="#">Colors</a></li>
          <li><a href="#">Typography</a></li>
          <li><a href="#">Logo Usage</a></li>
          <li><a href="#">Image Style</a></li>
        </ul>
      </div>
    </nav>

    <main>
      <h1>Masked Image Exporter</h1>

      <div class="step" id="step1">Step 1: Upload Image</div>
      <div id="uploadZone">
        <div><strong>Click or drag and drop an image here</strong></div>
        <input type="file" id="imageInput" accept="image/png, image/jpeg" />
        <img id="uploadPreview" alt="Preview" />
      </div>

      <div class="step" id="step2" style="display: none">
        Step 2: Select a Mask Shape
      </div>
      <div class="mask-grid" id="maskGrid"></div>

      <div class="step" id="step3" style="display: none">
        Step 3: Position and badges
      </div>
      <canvas
        id="previewCanvas"
        width="600"
        height="300"
        style="display: none"
      ></canvas>

      <div class="controls" id="positionControls" style="display: none">
        <button id="flipH">↔️ Flip H</button>
        <button id="flipV">↕️ Flip V</button>
        <button id="resetBtn">🔄 Reset</button>
        <button id="centerBtn">🎯 Center</button>
        <button id="rotateBtn">🔁 Rotate</button>
        <button id="zoomIn">🔎+</button>
        <button id="zoomOut">🔎-</button>
      </div>

      <div id="sizeDisplay"></div>

      <div class="bg-options" id="bgOptions">
        <label><strong>Choose background color</strong></label>
        <div class="color-buttons">
          <div
            class="color-btn"
            data-color="#4493cf"
            style="background: #4493cf"
          ></div>
          <div
            class="color-btn"
            data-color="#5e455e"
            style="background: #5e455e"
          ></div>
          <div
            class="color-btn"
            data-color="#f15e60"
            style="background: #f15e60"
          ></div>
          <div
            class="color-btn"
            data-color="#5cbd74"
            style="background: #5cbd74"
          ></div>
          <div
            class="color-btn"
            data-color="#fed84e"
            style="background: #fed84e"
          ></div>
          <button id="customColorBtn">
            <i class="hi hi-paint-rounded-stroke"></i> Custom Color
          </button>
          <input type="color" id="customColor" value="#ffffff" />
        </div>
      </div>

      <div class="badge-options" id="badgeOptions" style="display: none">
        <label class="badge-label">
          <input type="checkbox" id="addBadge" /> Add "Generated by AI" badge
        </label>
        <div class="language-buttons" id="languageButtons">
          <button class="language-btn selected" data-lang="nl">
            <img
              src="https://flagcdn.com/16x12/nl.png"
              class="flag"
              alt="Dutch Flag"
            />
            Dutch
          </button>
          <button class="language-btn" data-lang="en">
            <img
              src="https://flagcdn.com/16x12/gb.png"
              class="flag"
              alt="English Flag"
            />
            English
          </button>
        </div>
      </div>

      <div class="fixed-buttons">
        <button id="downloadPng" class="green disabled">
          💾 Export PNG
        </button>
        <button id="copyPng" class="green disabled">
          📋 Copy to Clipboard
        </button>
      </div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
  </body>
</html>
